```yaml
name: Build RedXBrowser for Windows

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish Windows executable
        run: dotnet publish RedXBrowser.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish

      - name: Upload browser EXE
        uses: actions/upload-artifact@v4
        with:
          name: RedXBrowser-Windows-x64
          path: publish/RedXBrowser.exe
          if-no-files-found: error
```
